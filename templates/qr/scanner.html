{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner — WTI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body { background: var(--dark-blue); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
    .scanner-card { background: rgba(255,255,255,0.97); border-radius: 24px; padding: 2rem; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    #qr-reader { border-radius: 12px; overflow: hidden; }
    #qr-reader video { border-radius: 12px; }
    .scanner-header { text-align: center; margin-bottom: 1.5rem; }
    .scanner-header img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; margin-bottom: 0.8rem; }
    .scanner-header h5 { font-weight: 800; color: var(--dark-blue); margin: 0; }
    .scanner-header p { color: #888; font-size: 0.85rem; margin: 0.3rem 0 0; }
    .manual-input { margin-top: 1.5rem; }
    .back-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; margin-top: 1.5rem; display: inline-flex; align-items: center; gap: 0.4rem; }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="scanner-card">
    <div class="scanner-header">
      <img src="{% static 'images/ChatGPT Image Apr 28, 2026, 10_01_09 AM.png' %}" alt="WTI">
      <h5>QR Code Scanner</h5>
      <p>Scan the attendance QR code on the classroom wall</p>
    </div>

    <!-- QR Reader -->
    <div id="qr-reader"></div>

    <!-- Status Message -->
    <div id="scanStatus" class="mt-3" style="display:none">
      <div class="alert alert-success text-center" id="scanMsg"></div>
    </div>

    <!-- Manual URL Entry -->
    <div class="manual-input">
      <p class="text-muted text-center" style="font-size:0.8rem">Or enter the QR URL manually:</p>
      <div class="input-group">
        <input type="text" id="manualUrl" class="form-control" placeholder="Paste QR URL here..." style="font-size:0.85rem">
        <button class="btn-gold px-3 rounded-end" onclick="goToUrl()">Go</button>
      </div>
    </div>
  </div>

  <a href="{% if request.user.is_staff %}{% url 'admin_dashboard' %}{% else %}{% url 'teacher_dashboard' %}{% endif %}" class="back-link">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </a>

  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    let scanned = false;

    function onScanSuccess(decodedText) {
      if (scanned) return;
      scanned = true;

      const statusDiv = document.getElementById('scanStatus');
      const msgDiv = document.getElementById('scanMsg');
      statusDiv.style.display = 'block';
      msgDiv.textContent = 'QR Code detected! Redirecting...';

      // Play success sound
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1047;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch(e) {}

      // Navigate to the scanned URL
      setTimeout(() => {
        if (decodedText.startsWith('http')) {
          window.location.href = decodedText;
        } else {
          window.location.href = decodedText;
        }
      }, 800);
    }

    function onScanError(err) {
      // Ignore scan errors (camera searching)
    }

    // Initialize scanner
    const html5QrcodeScanner = new Html5QrcodeScanner(
      'qr-reader',
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        rememberLastUsedCamera: true,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
      },
      false
    );
    html5QrcodeScanner.render(onScanSuccess, onScanError);

    function goToUrl() {
      const url = document.getElementById('manualUrl').value.trim();
      if (url) window.location.href = url;
    }
  </script>
</body>
</html>
