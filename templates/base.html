{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WTI Staff">
  <meta name="application-name" content="WTI Staff">
  <meta name="theme-color" content="#f5a623">
  <meta name="description" content="Winneba Technical Institute Staff Management System">

  <title>{% block title %}Winneba Technical Institute{% endblock %}</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="{% static 'manifest.json' %}">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% static 'icons/icon-152.png' %}">
  <link rel="apple-touch-icon" sizes="144x144" href="{% static 'icons/icon-144.png' %}">
  <link rel="apple-touch-icon" sizes="128x128" href="{% static 'icons/icon-128.png' %}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/icon-96.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/icon-72.png' %}">

  <!-- Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <!-- Offline Indicator -->
  <div id="onlineIndicator" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#dc3545;color:#fff;text-align:center;padding:0.5rem;font-size:0.82rem;font-weight:600;z-index:99999;align-items:center;justify-content:center;gap:0.5rem">
    <i class="fas fa-wifi-slash"></i> You are offline — some features may not work
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/pwa.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
