{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — WTI</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#f5a623">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1a2f5a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 5rem; margin-bottom: 1.5rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    h2 { font-size: 1.6rem; font-weight: 800; color: #f5a623; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.7); font-size: 0.9rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      background: linear-gradient(135deg, #f5a623, #e8920a);
      color: #fff; border: none; border-radius: 50px;
      padding: 0.9rem 2.5rem; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; width: 100%;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .school-name { color: rgba(255,255,255,0.4); font-size: 0.75rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h2>You're Offline</h2>
    <p>No internet connection detected. Please check your Wi-Fi or mobile data and try again.</p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Try Again
    </button>
    <p class="school-name">Winneba Technical Institute — Staff System</p>
  </div>
</body>
</html>
